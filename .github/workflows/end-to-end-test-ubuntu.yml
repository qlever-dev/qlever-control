name: End-to-end test on Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:

jobs:
  end-to-end-test-linux:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04]

    steps:
      - name: Checkout the repository for the qlever script
        uses: actions/checkout@v3
        with:
          path: qlever-control

      - name: Install qlever script locally + dependencies needed for testing
        working-directory: ${{github.workspace}}/qlever-control
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 --version
          pip3 --version
          pip3 show setuptools wheel
          pip3 install -e .
          sudo apt update && sudo apt install unzip expect

      # The pre-release `latest-master` of QLever always holds the portable
      # binaries of the last successfully built `master` commit (see the
      # workflow `portable-binaries.yml` there), so there is nothing to build.
      - name: Download the latest qlever binaries + docker image
        run: |
          mkdir -p qlever-binaries && cd $_
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            https://github.com/ad-freiburg/qlever/releases/download/latest-master/qlever-binaries-linux-x86_64.tar.gz | tar xz
          docker pull adfreiburg/qlever

      - name: Check that qlever binaries, docker image, and qlever script are found and work
        run: |
          mkdir qlever-indices
          export PATH="$PATH:$(pwd)/qlever-control:$(pwd)/qlever-binaries"
          docker run --entrypoint bash adfreiburg/qlever -c "qlever-server --help" | head -3
          docker run --entrypoint bash adfreiburg/qlever -c "qlever-index --help" | head -3
          qlever-server --help | head -3; echo "..."
          qlever-index --help | head -3; echo "..."
          qlever --help
          qeval --help
          qeval qlever --help

      - name: Test qlever script for olympics dataset, with docker
        timeout-minutes: 1
        run: |
          export PATH="$PATH:$(pwd)/qlever-binaries"
          export QLEVER_ARGCOMPLETE_ENABLED=1
          mkdir -p ${{github.workspace}}/qlever-indices/olympics.1 && cd $_
          qlever setup-config olympics
          qlever get-data
          unbuffer qlever index
          unbuffer qlever start
          qlever status
          qlever stop
          ls -lh

      - name: Test qlever script for olympics dataset, without docker
        timeout-minutes: 1
        run: |
          export PATH="$PATH:$(pwd)/qlever-binaries"
          export QLEVER_ARGCOMPLETE_ENABLED=1
          mkdir -p ${{github.workspace}}/qlever-indices/olympics.2 && cd $_
          qlever setup-config olympics
          qlever get-data
          qlever index --system native
          qlever start --system native
          qlever status
          qlever stop
          ls -lh

      - name: Test qlever script for olympics dataset, with and without docker
        timeout-minutes: 1
        run: |
          export PATH="$PATH:$(pwd)/qlever-binaries"
          export QLEVER_ARGCOMPLETE_ENABLED=1
          mkdir -p ${{github.workspace}}/qlever-indices/olympics.3 && cd $_
          qlever setup-config olympics
          qlever get-data
          unbuffer qlever index
          qlever start --system native
          qlever status
          qlever stop
          ls -lh

      - name: Test that qlever and qeval qlever are interchangeable
        timeout-minutes: 1
        run: |
          export PATH="$PATH:$(pwd)/qlever-binaries"
          export QEVAL_ARGCOMPLETE_ENABLED=1
          mkdir -p ${{github.workspace}}/qlever-indices/olympics.4 && cd $_
          qeval qlever setup-config olympics --system native
          qeval qlever get-data
          qeval qlever index

          # A server started via `qeval` must be visible to `qlever` ...
          qeval qlever start
          qlever status
          qlever stop

          # ... and the other way round, which is the direction that matters
          # for anyone with servers already started by `qlever`.
          qlever start
          qeval qlever status
          qeval qlever stop

          # Container names are keyed on the engine, not on the script name,
          # so both must build the same command. `--show` only prints it.
          diff <(qlever start --show --system docker) \
               <(qeval qlever start --show --system docker)
          ls -lh
